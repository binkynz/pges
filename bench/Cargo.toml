[package]
name = "pges-bench"
description = "Benchmarks for pges: appends, the sequencer, the outbox's NOTIFY lock, and reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "pges-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
hdrhistogram = { version = "7.5", default-features = false }
pges = { path = "../crates/pges", features = ["derive", "subscribe", "sequencer", "wake-grpc", "wake-inproc", "watch-grpc"] }
pges-testing = { path = "../crates/pges-testing" }
serde_json = "1.0.140"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
uuid = { version = "1.26.1", features = ["v7"] }
