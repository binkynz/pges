[package]
name = "pges-postgres"
description = "PostgreSQL storage for pges: stores, appends, stream reads, migrations and partition maintenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["event-sourcing", "event-store", "postgres", "postgresql", "sqlx"]
categories = ["database", "asynchronous"]
include = ["src/**/*", "migrations/**/*", "sql/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# Appends whose metadata has no trace record the current tracing span's W3C trace context.
otel = ["pges-core/otel"]

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
pges-core = { path = "../pges-core", version = "0.1.0" }
serde = "1"
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.44", features = ["rt", "time"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
anyhow = "1.0.105"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
pges-testing = { path = "../pges-testing" }
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.41"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
trybuild = "1.0.105"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
