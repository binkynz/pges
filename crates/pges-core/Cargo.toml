[package]
name = "pges-core"
description = "Core types for pges: stream ids, versions, positions, events, aggregates and the payload frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["event-sourcing", "event-store", "cqrs"]
categories = ["database", "data-structures"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["json"]
json = ["dep:serde_json"]
# W3C trace context from and to the current `tracing` span, through tracing-opentelemetry.
otel = ["dep:opentelemetry", "dep:tracing", "dep:tracing-opentelemetry"]

[lints]
workspace = true

[dependencies]
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"], optional = true }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2"
time = "0.3"
tracing = { version = "0.1.41", default-features = false, features = ["std"], optional = true }
tracing-opentelemetry = { version = "0.34.0", default-features = false, optional = true }
uuid = { version = "1.26.1", features = ["v5", "v7"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
trybuild = "1.0.105"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
