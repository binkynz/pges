[package]
name = "pges-replication"
description = "Minimal PostgreSQL logical replication client: replication connection, pgoutput decoding, standby status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["postgres", "replication", "pgoutput", "logical-replication", "cdc"]
categories = ["database", "network-programming", "asynchronous"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
bytes = "1.11"
fallible-iterator = "0.2"
percent-encoding = "2.3"
pges-core = { path = "../pges-core", version = "0.1.0", default-features = false }
postgres-protocol = "0.6.12"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8.5", optional = true }
rustls-pki-types = { version = "1.16", features = ["std"], optional = true }
sha2 = { version = "0.10.9", optional = true }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
url = "2.5"

[features]
# TLS through rustls with the ring provider: sslmode, sslrootcert, sslnegotiation, channel binding.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:sha2", "dep:tokio-rustls"]

[dev-dependencies]
anyhow = "1.0.105"
pges-testing = { path = "../pges-testing" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
trybuild = "1.0.105"
uuid = { version = "1.26.1", features = ["v7"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
