[package]
name = "pges-derive"
description = "#[derive(Event)] for pges: stable event type names, schema versions and upcasting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["event-sourcing", "event-store", "derive"]
categories = ["database", "development-tools::procedural-macro-helpers"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = "2.0.100"

[dev-dependencies]
pges-core = { path = "../pges-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
trybuild = "1.0.105"
uuid = { version = "1.26.1", features = ["serde", "v7"] }
