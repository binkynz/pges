[package]
name = "pges-subscribe-tests"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["pges-subscribe/default"]
otel = ["pges-subscribe/otel", "dep:opentelemetry"]
wake-grpc = ["pges-subscribe/wake-grpc"]
wake-grpc-tls = ["pges-subscribe/wake-grpc-tls", "dep:rustls", "dep:rustls-pki-types"]
wake-inproc = ["pges-subscribe/wake-inproc"]
